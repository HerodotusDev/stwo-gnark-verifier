version: "2"
run:
  timeout: 10m
  issues-exit-code: 1

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
  settings:
    staticcheck:
      checks:
        - all
        - '-QF1003'
        - '-QF1008'
        - '-ST1003'
    gosec:
      excludes:
        - G115
  exclusions:
    generated: disable
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - third_party$
      - builtin$
      - examples$

issues:
  exclude-rules:
    - path: ^components/cairo_components/
      linters:
        - gosec
      text: "G115"

formatters:
  enable:
    - gofmt
  exclusions:
    generated: disable
    paths:
      - third_party$
      - builtin$
      - examples$